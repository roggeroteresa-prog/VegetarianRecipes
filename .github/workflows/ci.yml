name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Installazione dipendenze
        run: npm ci

      - name: Linting
        run: npm run lint

  build:
    name: Build immagine Docker
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Build immagine Docker (stage di produzione)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false
          build-args: |
            REACT_APP_SPOONACULAR_KEY=${{ secrets.REACT_APP_SPOONACULAR_KEY }}
            REACT_APP_SENTRY_DSN=${{ secrets.REACT_APP_SENTRY_DSN }}
          tags: vegetarian-recipes:ci

  deploy:
    name: Deploy su GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Installazione dipendenze
        run: npm ci

      - name: Build di produzione
        run: npm run build
        env:
          REACT_APP_SPOONACULAR_KEY: ${{ secrets.REACT_APP_SPOONACULAR_KEY }}
          REACT_APP_SENTRY_DSN: ${{ secrets.REACT_APP_SENTRY_DSN }}

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica l'artifact della build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
