name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Installazione dipendenze
        run: npm ci

      - name: Linting
        run: npm run lint

  build:
    name: Build immagine Docker
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Build immagine Docker (stage di produzione)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false
          build-args: |
            REACT_APP_SPOONACULAR_KEY=${{ secrets.REACT_APP_SPOONACULAR_KEY }}
          tags: vegetarian-recipes:ci
