server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React Router usa la history API: qualsiasi route sconosciuta
    # deve ricadere su index.html, altrimenti il refresh su /favorites da 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache lunga per gli asset con hash nel nome (CRA li genera così)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
